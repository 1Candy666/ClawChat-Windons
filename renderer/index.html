<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" />
  <title>ClawChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <nav class="rail">
      <div class="logo" title="ClawChat">🐾</div>
      <button class="rail-btn" data-view="chats" title="聊天">💬<span>聊天</span></button>
      <button class="rail-btn" data-view="projects" title="项目">🧪<span>项目</span></button>
      <button class="rail-btn" data-view="agents" title="联系人">👥<span>联系人</span></button>
      <button class="rail-btn" data-view="tasks" title="任务看板">📋<span>任务</span></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-view="settings" title="设置">⚙️<span>设置</span></button>
    </nav>
    <aside class="list">
      <div class="list-head">
        <input id="search" placeholder="搜索" />
        <button id="list-add" class="icon-btn" title="新建">＋</button>
      </div>
      <div id="list-body" class="list-body"></div>
    </aside>
    <main id="main" class="main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script src="collab.js"></script>
  <script src="extras.js"></script>
  <script src="remote.js"></script>
  <script src="tasks.js"></script>
  <script src="skills.js"></script>
  <script src="project.js"></script>
  <script src="understand.js"></script>
  <script src="app.js"></script>
</body>
</html>
